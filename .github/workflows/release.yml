name: Release

# Every push to main that changes the program publishes a new patch release
# automatically (see the "version" job for the rules). Pushing a tag like v1.0.0 by hand
# still publishes that exact version. Running the workflow by hand does everything
# except publishing, and keeps the files as workflow artifacts, to rehearse a release.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "AGENTS.md"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a rehearsal build, without the v (nothing is published)"
        required: true
        default: "0.0.0-rehearsal"

permissions:
  contents: write # create the release
  id-token: write # sign the build provenance
  attestations: write

# One release at a time, so two quick pushes to main cannot pick the same version. A
# newer push waiting in line replaces an older one; it contains its commits anyway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Decides the version. A pushed tag is used as is. A push to main takes the highest
  # stable tag (vX.Y.Z) and bumps it: the patch number by default, the minor number if a
  # commit since that tag says [minor] in its message, the major number for [major]. A
  # head commit that says [skip release], or that already carries a v* tag, publishes
  # nothing.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every tag and the commits since the last one

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            if git log -1 --format=%B | grep -qiF "[skip release]"; then
              echo "The head commit says [skip release]."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [[ -n "$(git tag --points-at HEAD --list 'v*')" ]]; then
              echo "This commit is already released as $(git tag --points-at HEAD --list 'v*')."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            last=$(git tag --list 'v*' --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
            if [[ -z "$last" ]]; then
              version="0.1.0"
            else
              IFS=. read -r major minor patch <<< "${last#v}"
              messages=$(git log "$last..HEAD" --format=%B)
              if grep -qiF "[major]" <<< "$messages"; then
                version="$((major + 1)).0.0"
              elif grep -qiF "[minor]" <<< "$messages"; then
                version="$major.$((minor + 1)).0"
              else
                version="$major.$minor.$((patch + 1))"
              fi
            fi
            echo "Last release: ${last:-none}. Next: $version"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a version like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; fi

  release:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and test the user interface
        working-directory: web
        run: |
          npm ci
          npm run build
          npm test

      - name: Test (a release is never built from a red tree)
        run: |
          go vet ./...
          go test -race ./...
          go run ./tools/nonetwork .

      - name: Build executables
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p release
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=$arch go build -trimpath \
              -ldflags "-H windowsgui -s -w -X main.version=$VERSION" \
              -o "release/ullage-$VERSION-windows-$arch.exe" ./cmd/ullage
          done

      - name: Smoke test the amd64 executable
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The release build has no console, so its output is redirected to a file.
          $exe = "release/ullage-$env:VERSION-windows-amd64.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru `
            -RedirectStandardOutput version.txt -NoNewWindow
          $printed = (Get-Content version.txt -Raw).Trim()
          if ($process.ExitCode -ne 0 -or $printed -ne $env:VERSION) {
            throw "smoke test failed: exit $($process.ExitCode), printed '$printed'"
          }

      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          scripts/notices.sh release/THIRD-PARTY-NOTICES.txt
          for arch in amd64 arm64; do
            folder="staging/ullage-$VERSION-windows-$arch"
            mkdir -p "$folder"
            cp "release/ullage-$VERSION-windows-$arch.exe" "$folder/ullage.exe"
            cp README.md release/THIRD-PARTY-NOTICES.txt "$folder/"
            (cd staging && 7z a -tzip -mx=9 "../release/ullage-$VERSION-windows-$arch.zip" \
              "ullage-$VERSION-windows-$arch" > /dev/null)
          done
          (cd release && sha256sum ullage-* THIRD-PARTY-NOTICES.txt > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      # GitHub offers attestations for public repositories (and organizations' private
      # ones); for a private personal repository the step is skipped, not failed.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.exe
            release/*.zip

      - name: Keep the files as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ullage-${{ needs.version.outputs.version }}
          path: release/

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          PRIVATE: ${{ github.event.repository.private }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cat > notes.md <<NOTES
          Download \`ullage-$VERSION-windows-amd64.exe\` (most PCs) or the \`arm64\` build
          for Windows on ARM, put it where you keep programs and run it. The \`.zip\` files
          hold the same executable with the README and third-party notices.

          Verify a download against \`SHA256SUMS.txt\`.
          NOTES
          if [[ "$PRIVATE" != "true" ]]; then
            cat >> notes.md <<NOTES
          Check that GitHub built it from this repository:

          \`\`\`
          gh attestation verify ullage-$VERSION-windows-amd64.exe --repo $GITHUB_REPOSITORY
          \`\`\`
          NOTES
          fi
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            flags+=(--verify-tag)
          else
            # Creates the tag on the commit that was built. A tag made with this token
            # does not start another workflow run.
            flags+=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" release/* \
            --title "Ullage $VERSION" --notes-file notes.md --generate-notes "${flags[@]}"
