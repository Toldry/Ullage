id = "phone-backups"
version = 2
name = "iPhone and iPad backups"
what = """\
  Full device backups made by iTunes or the Apple Devices app, one folder per backup."""
lost = """\
  The backup. If it is the only copy of photos or messages from an old or lost device, \
  they are gone for good."""
regenerable = "no"

[paths]
windows = [
  "{UserProfile}/AppData/Roaming/Apple Computer/MobileSync/Backup",
  "{UserProfile}/Apple/MobileSync/Backup",
]

[[managed_steps]]
text = """\
  Apple Devices app: select the device > Manage Backups, then delete the backups you no \
  longer need. In iTunes: Edit > Preferences > Devices."""

[brute_force]
allowed = true
warning = """\
  A backup may be the only copy of photos and messages from an old or lost device; it cannot \
  be recovered after the Recycle Bin is emptied. The Apple Devices app or iTunes may still \
  list deleted backups until it is restarted."""
