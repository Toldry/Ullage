id = "rustup-toolchains"
version = 2
name = "Rust toolchains"
what = "Rust compilers and standard libraries installed by rustup, one folder per toolchain."
lost = "Toolchains you remove must be installed again before projects that pin them can build."
regenerable = "yes"

[paths]
windows = ["{UserProfile}/.rustup/toolchains"]
linux = ["{UserProfile}/.rustup/toolchains"]

[[managed_steps]]
text = "List installed toolchains."
command = "rustup toolchain list"

[[managed_steps]]
text = "Remove the ones you no longer use."
command = "rustup toolchain uninstall <toolchain>"

[brute_force]
allowed = true
warning = """\
  If rustup is still installed, it keeps listing the deleted toolchains as installed, and \
  builds that pin one fail until you run rustup toolchain uninstall or install for it. If \
  Rust is no longer installed, deleting the folders is safe."""
