id = "ollama-models"
version = 2
name = "Ollama models"
what = "Local language models pulled or created with Ollama, stored as shared blobs plus manifests."
lost = "Pulled models download again; models you created from a Modelfile must be rebuilt."
regenerable = "partially"

[paths]
windows = ["{UserProfile}/.ollama/models"]
linux = ["{UserProfile}/.ollama/models", "/usr/share/ollama/.ollama/models"]

[[managed_steps]]
text = "List installed models."
command = "ollama list"

[[managed_steps]]
text = "Remove the ones you no longer use."
command = "ollama rm <model>"

[brute_force]
allowed = true
warning = """\
  Removes every model at once. Removing only some files breaks the models that share them; \
  if Ollama is still installed, pull the models you need again afterwards."""
