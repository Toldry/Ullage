id = "huggingface-cache"
version = 1
name = "Hugging Face model cache"
what = "Model weights and datasets downloaded by the huggingface_hub library, one models--* folder per model."
lost = "The weights. Public models download again; gated models need your account to still have access."
regenerable = "partially"

[paths]
windows = ["{UserProfile}/.cache/huggingface/hub"]
linux = ["{UserProfile}/.cache/huggingface/hub"]

[[managed_steps]]
text = "List cached models and revisions."
command = "huggingface-cli scan-cache"

[[managed_steps]]
text = "Pick revisions to delete interactively."
command = "huggingface-cli delete-cache"

[brute_force]
allowed = true
