id = "maven-repository"
version = 1
name = "Maven local repository"
what = "Artifacts Maven downloaded, plus anything installed locally with mvn install."
lost = "Downloaded artifacts come back on the next build; artifacts you only ever built locally with mvn install do not."
regenerable = "partially"

[paths]
windows = ["{UserProfile}/.m2/repository"]
linux = ["{UserProfile}/.m2/repository"]

[[managed_steps]]
text = "From a project folder, purge and re-resolve that project's dependencies."
command = "mvn dependency:purge-local-repository"

[brute_force]
allowed = true
