id = "visual-studio-package-cache"
version = 2
name = "Visual Studio and installer package cache"
what = """\
  Installer payloads kept so Visual Studio and other MSI-based products can repair, modify or \
  uninstall themselves."""
lost = """\
  Repairs and modifications need the original media or a download; some uninstallers fail \
  without their cached package."""
regenerable = "partially"

[paths]
windows = ["{ProgramData}/Microsoft/VisualStudio/Packages", "{ProgramData}/Package Cache"]

[[managed_steps]]
text = """\
  Visual Studio Installer > Modify > Installation locations, then clear Keep download cache \
  after the installation."""

[brute_force]
allowed = true
warning = """\
  Visual Studio and other programs installed from these packages may fail to repair, modify, \
  update or uninstall until they download the packages again or you provide the original \
  installer. Programs that are no longer installed are not affected."""
