id = "component-store"
version = 1
name = "Windows component store (WinSxS)"
what = """\
  Every Windows component and the previous versions kept after updates. Most files are hard \
  links shared with System32; Ullage counts shared bytes once, at System32."""
lost = "After cleanup you can no longer uninstall the superseded updates."
regenerable = "no"

[paths]
windows = ["{SystemRoot}/WinSxS"]

[[managed_steps]]
text = "See how much can be reclaimed (elevated terminal)."
command = "Dism.exe /Online /Cleanup-Image /AnalyzeComponentStore"

[[managed_steps]]
text = "Remove superseded components (elevated terminal)."
command = "Dism.exe /Online /Cleanup-Image /StartComponentCleanup"

[brute_force]
allowed = false
reason = "Deleting files in WinSxS breaks Windows Update, repairs and optional features."
